# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER # Phím chính (phím Windows/Command)
$scriptsDir = $HOME/.config/hypr/scripts # Thư mục chứa scripts
$UserScripts = $HOME/.config/hypr/UserScripts # Thư mục scripts người dùng
$UserConfigs = $HOME/.config/hypr/UserConfigs # Thư mục cấu hình người dùng

# Cài đặt cho ứng dụng mặc định của người dùng - đặt terminal và file manager mặc định trong file này
source= $UserConfigs/01-UserDefaults.conf

# Phím tắt phổ biến (Common shortcuts)
#bindr = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Phím Super để mở menu rofi
bind = $mainMod, D, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window # Menu chính (Trình khởi chạy ứng dụng)
bind = $mainMod, B, exec, xdg-open "https://" # Trình duyệt mặc định
#bind = $mainMod, A, exec, pkill rofi || true && ags -t 'overview' # Tổng quan desktop (nếu đã cài)
bind = $mainMod, A, global, quickshell:overviewToggle # Tổng quan desktop (nếu đã cài quickshell)
bind = $mainMod, Return, exec, $term # Mở terminal
bind = $mainMod, E, exec, $files # Mở file manager

# TÍNH NĂNG / BỔ SUNG (FEATURES / EXTRAS)
bind = $mainMod, H, exec, $scriptsDir/KeyHints.sh # Trợ giúp / Bảng gợi ý phím tắt
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh # Làm mới waybar, swaync, rofi
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh # Menu emoji
bind = $mainMod, S, exec, $scriptsDir/RofiSearch.sh # Tìm kiếm Google bằng rofi
bind = $mainMod ALT, O, exec, $scriptsDir/ChangeBlur.sh # Bật/tắt hiệu ứng làm mờ
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # Bật/tắt animations (chế độ game)
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Chuyển đổi Layout Master hoặc Dwindle
bind = $mainMod, V, exec, $scriptsDir/ClipManager.sh # Quản lý clipboard
bind = $mainMod CTRL, R, exec, $scriptsDir/RofiThemeSelector.sh # Menu chọn theme Rofi của KooL
bind = $mainMod CTRL SHIFT, R, exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh # Menu chọn theme Rofi đã chỉnh sửa

bind = $mainMod SHIFT, F, fullscreen, 1# Toàn màn hình thực sự
bind = $mainMod CTRL, F, fullscreen# Toàn màn hình giả
bind = $mainMod, SPACE, togglefloating, # Chế độ cửa sổ nổi (Float Mode)
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat # Chế độ tất cả cửa sổ nổi
bind = $mainMod SHIFT, Return, exec, $scriptsDir/Dropterminal.sh $term # Terminal thả xuống (Dropdown)

# Phóng to desktop hoặc kính lúp (Desktop zooming or magnifier)
bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')" # Phóng to con trỏ
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" # Thu nhỏ con trỏ

## GHI CHÚ cho ja (Hyprland phiên bản 0.39 (Ubuntu 24.04))
#bind = $mainMod ALT, mouse_down, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
#bind = $mainMod ALT, mouse_up, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

# Waybar / Thanh trạng thái liên quan
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar # Bật/tắt ẩn/hiện waybar
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Menu chọn style Waybar
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Menu chọn layout Waybar

# TÍNH NĂNG / BỔ SUNG (UserScripts)
bind = $mainMod SHIFT, M, exec, $UserScripts/RofiBeats.sh # Nghe nhạc online bằng rofi
bind = $mainMod, W, exec, $UserScripts/WallpaperSelect.sh # Chọn hình nền để áp dụng
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperEffects.sh # Hiệu ứng hình nền bằng imagemagick
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh # Hình nền ngẫu nhiên
bind = $mainMod CTRL, O, exec, hyprctl setprop active opaque toggle # Tắt/bật độ trong suốt trên cửa sổ đang hoạt động
bind = $mainMod, K, exec, $scriptsDir/KeyBinds.sh # Tìm kiếm phím tắt qua rofi
bind = $mainMod SHIFT, A, exec, $scriptsDir/Animations.sh # Menu animations của hyprland
bind = $mainMod SHIFT, O, exec, $UserScripts/ZshChangeTheme.sh # Thay đổi theme oh-my-zsh
bindln = ALT_L, SHIFT_L, exec, $scriptsDir/SwitchKeyboardLayout.sh # Thay đổi bố cục bàn phím toàn cục
bindln = SHIFT_L, ALT_L, exec, $scriptsDir/Tak0-Per-Window-Switch.sh # Thay đổi bố cục bàn phím riêng cho từng cửa sổ
bind = $mainMod ALT, C, exec, $UserScripts/RofiCalc.sh # Máy tính (qalculate)
bind = $mainMod, N, exec, $UserScripts/Quick-Notes.sh

# Di chuyển focus bằng ALT + h j k l (Move focus)
bind = ALT, h, movefocus, l # Focus sang cửa sổ bên trái
bind = ALT, l, movefocus, r # Focus sang cửa sổ bên phải
bind = ALT, k, movefocus, u # Focus sang cửa sổ phía trên
bind = ALT, j, movefocus, d # Focus sang cửa sổ phía dưới

bind = $mainMod, Y, exec, foot -e yazi

# Để passthrough bàn phím vào VM (For passthrough keyboard into a VM)
# bind = $mainMod ALT, P, submap, passthru # Bật chế độ passthru
#submap = passthru
# để unbind
#bind = $mainMod ALT, P, submap, reset # Tắt chế độ passthru
#submap = reset
